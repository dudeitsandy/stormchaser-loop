formulas:
  - name: condition_effective_multiplier   # F1
    source: design/gdd/surfaces-terrain-modifiers.md
    variables: [Strength, R, d, EdgeFeather, GripMul, DragMul]
    output_range: "GripMul_eff 0.2–1.0; DragMul_eff 1.0–3.0"
    referenced_by: []
    written: 2026-10-01
  - name: condition_strongest_wins          # F2
    source: design/gdd/surfaces-terrain-modifiers.md
    variables: [GripMul_eff, DragMul_eff]
    output_range: "Grip_c 0.2–1.0; Drag_c 1.0–3.0"
    referenced_by: []
    written: 2026-10-01
  - name: surface_vehicle_affinity          # F3
    source: design/gdd/surfaces-terrain-modifiers.md
    variables: [Grip_in, Drag_in, GripSens, DragSens, TireGrip, NoBonus]
    output_range: "GripSens/DragSens 0–2; TireGrip 0.6–1.2"
    referenced_by: []
    written: 2026-10-01
  - name: surface_sample_final              # F4
    source: design/gdd/surfaces-terrain-modifiers.md
    variables: [BaseGrip, BaseDrag, Grip_c, Drag_c, GripFloor, GripCeil, MaxDrag]
    output_range: "Grip 0.25–1.2; Drag 0–4.0 m/s²"
    referenced_by: [design/gdd/vehicle-feel.md]
    written: 2026-10-01
  - name: condition_zone_strength           # F5
    source: design/gdd/surfaces-terrain-modifiers.md
    variables: [Strength, dt, RampIn, DecayTime, RefreshHold]
    output_range: "0–1"
    referenced_by: []
    written: 2026-10-01
  - name: album_eviction                    # F1
    source: design/gdd/save-profile.md
    variables: [Score, Date, CoverId, Pinned, AlbumCap]
    output_range: "one unpinned victim, or none (all pinned / new cover loses)"
    referenced_by: []
    written: 2026-10-01

  - name: storm_regime_draw   # F1
    source: design/gdd/storm-director.md
    variables: [H, w0_r, s_r, p5_0]
    output_range: "regime probabilities sum to 1; P(any EF5) ~4.2% Heat 0, ~13% Heat 5"
    referenced_by: []
    written: 2026-10-01
  - name: storm_cell_schedule   # F2
    source: design/gdd/storm-director.md
    variables: [N_cells, T, t_peak, Form, SpawnDist, CapTotal, CapDelay]
    output_range: "T 315-450 s; anchor peak 0.40-0.65 T; satellites <= EF3"
    referenced_by: []
    written: 2026-10-01
  - name: storm_scale   # F3
    source: design/gdd/storm-director.md
    variables: [d, I, P_EF, R_EF, D_EF]
    output_range: "W(d) = P*I*(1 - d/(R*I))^2; EF3 8.1 m/s @15 m, EF5 38.3 m/s @15 m"
    referenced_by: []
    written: 2026-10-01
  - name: storm_forecast_estimate   # F4
    source: design/gdd/storm-director.md
    variables: [d, b_i, b_t, t_true]
    output_range: "|EF error| <= 1; exact inside 150 m; ETA error 5-45%"
    referenced_by: []
    written: 2026-10-01
  - name: storm_track_motion   # F5
    source: design/gdd/storm-director.md
    variables: [omega_EF, v_track, lambda0, v_cap]
    output_range: "speed 0.4 v_track to 12.9 m/s; never reads player position"
    referenced_by: []
    written: 2026-10-01

